name: news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sources and post
        env:
          DISCORD_NEWS_BOT_TOKEN: ${{ secrets.DISCORD_NEWS_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python news_bot.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json news.json site.json
          git diff --cached --quiet || (git commit -m "Update state" && git pull --rebase && git push)

  next:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: sleep 1500
      - name: Start next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml -R ${{ github.repository }} --ref main
